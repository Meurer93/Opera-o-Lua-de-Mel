name = "lua-de-mel"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# O mesmo Worker serve o site (embutido por `npm run build`) e a API em /api/*.

# Conciliação a cada 5 minutos: reconsulta cobranças em aberto na API da Efí.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lua-de-mel"
database_id = "aaad3483-d6b4-48c4-8a5d-d4cb5bd8a918"

[vars]
EFI_ENV = "producao"
ALLOWED_ORIGINS = "https://opera-o-lua-de-mel.pages.dev,https://lua-de-mel.andrejosemeurer.workers.dev"
# IP divulgado pela Efí para envio de webhooks (dev.efipay.com.br/docs/api-pix/webhooks)
EFI_WEBHOOK_IPS = "34.193.116.226"

# Certificado da Efí (.p12 convertido para PEM). Depois de enviar com
#   npx wrangler mtls-certificate upload --cert efi.crt.pem --key efi.key.pem --name efi-producao
# descomente o bloco abaixo com o ID exibido:
# [[mtls_certificates]]
# binding = "EFI_CERT"
# certificate_id = "COLE_O_ID_AQUI"

# Segredos (NUNCA neste arquivo): defina no painel do Cloudflare ou com `wrangler secret put`
#   EFI_CLIENT_ID, EFI_CLIENT_SECRET, EFI_PIX_KEY, WEBHOOK_HMAC, ADMIN_TOKEN
