name = "lua-de-mel"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Este Worker serve somente a API (/api/*); o site fica no Cloudflare Pages.

# Conciliação a cada 5 minutos: reconsulta cobranças em aberto na API da Efí.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lua-de-mel"
database_id = "aaad3483-d6b4-48c4-8a5d-d4cb5bd8a918"

[vars]
EFI_ENV = "producao"
ALLOWED_ORIGINS = "https://opera-o-lua-de-mel.pages.dev,https://lua-de-mel.andrejosemeurer.workers.dev"
# IP divulgado pela Efí para envio de webhooks (dev.efipay.com.br/docs/api-pix/webhooks)
EFI_WEBHOOK_IPS = "34.193.116.226"
# Intermediário mTLS fora do Cloudflare (pasta efi-proxy/, hospedado na Vercel)
EFI_PROXY_URL = "https://efi-proxy-lua-de-mel.vercel.app/api/efi"

# Certificado da Efí (produção). Para trocar: envie um novo com scripts/enviar-certificado.mjs e atualize o ID.
[[mtls_certificates]]
binding = "EFI_CERT"
certificate_id = "9e1b9ac4-e3e7-4643-8b32-15d51a86753c"  # efi-producao-968088, expira em 19/11/2029

# Segredos (NUNCA neste arquivo): defina no painel do Cloudflare ou com `wrangler secret put`
#   EFI_CLIENT_ID, EFI_CLIENT_SECRET, EFI_PIX_KEY, WEBHOOK_HMAC, ADMIN_TOKEN
